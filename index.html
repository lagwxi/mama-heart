<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Сердце из слова мама</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #heart {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');

const WORD = 'мама';
const COLOR = '#ff2d55';
const BG = '#000000';
const NUM_WORDS = 140;          // сколько слов по контуру
const FONT_RATIO = 0.018;       // размер шрифта = 1.8% от min(W,H)
const HEART_SCALE = 1 / 3;      // сердце занимает 1/3 экрана

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth;
  const H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(W, H);
}

// Параметрическое уравнение сердца
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);
  return [x, y];
}

function draw(W, H) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  const fontSize = Math.max(10, Math.min(W, H) * FONT_RATIO);
  ctx.font = `bold ${fontSize}px -apple-system, Helvetica, Arial, sans-serif`;
  ctx.fillStyle = COLOR;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Масштаб: сердце ~1/3 меньшей стороны экрана
  const base = Math.min(W, H) * HEART_SCALE;
  const scale = base / 32;   // 32 — примерно ширина сердца в единицах формулы
  const cx = W / 2;
  const cy = H / 2;

  for (let i = 0; i < NUM_WORDS; i++) {
    const t = (2 * Math.PI * i) / NUM_WORDS;
    const [x, y] = heartPoint(t);
    const px = cx + x * scale;
    const py = cy - y * scale;   // ось Y в canvas вниз
    ctx.fillText(WORD, px, py);
  }
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
// Закрытие/перезапуск по тапу (на iOS Safari просто ничего, но приятно)
canvas.addEventListener('click', () => { resize(); });

resize();
</script>
</body>
</html>
