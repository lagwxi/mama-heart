
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Сердце для мамы ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080008;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#heart {
    position: relative;
    width: min(96vw, 70vh, 620px);
    aspect-ratio: 1;
    animation: pulse 2s ease-in-out infinite;
}

.word {
    position: absolute;
    transform: translate(-50%, -50%);
    color: #ff2998;
    font-size: clamp(10px, 2.8vw, 17px);
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 7px #ff2998;
}

@keyframes pulse {
    0%, 100% { transform: scale(0.97); }
    50% { transform: scale(1.03); }
}

@media (prefers-reduced-motion: reduce) {
    #heart { animation: none; }
}
</style>
</head>

<body>

<div id="heart" aria-label="Контур сердца из слов мама"></div>

<script>
const heart = document.getElementById("heart");

// Параметры контура
const total = 54;

for (let i = 0; i < total; i++) {
    const t = (2 * Math.PI * i) / total;

    // Математическая форма сердца
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const word = document.createElement("span");
    word.className = "word";
    word.textContent = "мама";

    // Располагаем слова по контуру, не поворачивая их
    word.style.left = (50 + x * 2.65) + "%";
    word.style.top = (48 - y * 2.65) + "%";

    heart.appendChild(word);
}
</script>

</body>
</html>
