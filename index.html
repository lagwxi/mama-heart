
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Сердце для мамы ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #080008;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #heart {
            position: relative;
            width: min(92vw, 65vh, 560px);
            aspect-ratio: 1 / 1;
            animation: heartbeat 2s ease-in-out infinite;
            transform-origin: center;
        }

        .word {
            position: absolute;
            transform: translate(-50%, -50%);
            color: #ff2998;
            font-size: clamp(9px, 2.7vw, 16px);
            font-weight: bold;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 0 5px #ff299866;
            user-select: none;
        }

        .word.big {
            font-size: clamp(11px, 3.2vw, 19px);
            color: #ff75bb;
            text-shadow: 0 0 8px #ff2998aa;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(0.97);
            }

            50% {
                transform: scale(1.03);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #heart {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div id="heart" aria-label="Сердце из слова мама"></div>

    <script>
        const heart = document.getElementById("heart");

        
        
const rows = 31;
const cols = 31;

for (let row = 0; row < rows; row++) {
    const y = 1.15 - row * (2.3 / (rows - 1));

    for (let col = 0; col < cols; col++) {
        const x = -1.25 + col * (2.5 / (cols - 1));

        const shape =
            Math.pow(x * x + y * y - 1, 3)
            - x * x * y * y * y;

        if (shape <= 0) {
            // Оставляем только точки по контуру сердца
            const innerX = x + 0.25;
            const innerY = y;

            const innerShape =
                Math.pow(innerX * innerX + innerY * innerY - 0.72, 3)
                - innerX * innerX * innerY * innerY * innerY;

            if (shape > -0.15 || innerShape > 0) {
                const word = document.createElement("span");

                word.className = "word";
                word.textContent = "мама";

                word.style.left = ((x + 1.3) / 2.6 * 100) + "%";
                word.style.top = ((1.2 - y) / 2.4 * 100) + "%";

                heart.appendChild(word);
            }
        }
    }
}

    </script>

</body>
</html>
