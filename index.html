<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Сердце из слова мама</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #heart {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');

// ===== Настройки =====
const WORD        = 'мама';
const COLOR       = '#ff2d55';
const BG          = '#000000';
const NUM_WORDS   = 45;          // расстояние между словами (меньше = реже)
const FONT_RATIO  = 0.016;       // размер шрифта (доля от min(W,H))
const HEART_SCALE = 1 / 1;       // ← было 1/2 → в 2 раза больше (на всю меньшую сторону)
const GLOW        = true;

// Пульсация
const PULSE_MIN   = 0.94;
const PULSE_MAX   = 1.06;
const PULSE_SPEED = 2.2;

let W = 0, H = 0, dpr = 1;
let fontSize = 12;
let baseScale = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  fontSize  = Math.max(10, Math.min(W, H) * FONT_RATIO);
  baseScale = (Math.min(W, H) * HEART_SCALE) / 32;
}

// Параметрическое уравнение сердца
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);
  return [x, y];
}

// Предрасчёт позиций слов
const points = [];
for (let i = 0; i < NUM_WORDS; i++) {
  const t = (2 * Math.PI * i) / NUM_WORDS;
  points.push(heartPoint(t));
}

function drawFrame(time) {
  const pulse = (Math.sin(time * PULSE_SPEED) + 1) / 2;
  const pulseScale = PULSE_MIN + (PULSE_MAX - PULSE_MIN) * pulse;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  ctx.font = `bold ${fontSize}px -apple-system, Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (GLOW) {
    ctx.shadowColor = COLOR;
    ctx.shadowBlur  = fontSize * 0.9 * pulseScale;
  } else {
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = COLOR;

  const cx = W / 2;
  const cy = H / 2;
  const s  = baseScale * pulseScale;

  for (let i = 0; i < points.length; i++) {
    const [x, y] = points[i];
    ctx.fillText(WORD, cx + x * s, cy - y * s);
  }
}

let start = null;
function loop(ts) {
  if (start === null) start = ts;
  const time = (ts - start) / 1000;
  drawFrame(time);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resize(); });
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

resize();
requestAnimationFrame(loop);
</script>
</body>
